name: keep-warm

# Pings the Render-hosted /healthz endpoint every 5 minutes to prevent the free-tier dyno from
# sleeping. GitHub Actions runs this on its own schedulers — no external service needed.
#
# Caveats:
# - GitHub Actions cron is "best-effort." During heavy load it sometimes skips runs by 5–15 min.
#   That's usually fine for keep-warm purposes (a single skipped ping still won't put Render's
#   dyno to sleep — they sleep after 15 min of total inactivity).
# - The workflow can also be triggered manually from the Actions tab via workflow_dispatch.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /healthz
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://chess-engine-proxy.onrender.com/healthz
