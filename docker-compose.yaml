# Coolify deployment: both services from this one repo, one public URL.
#
# - `proxy` is the existing Node/Stockfish API — assign the public domain
#   (chessengine.api.ardasen.com) to THIS service in the Coolify UI, port 3000.
# - `fen-service` is the board-photo -> FEN recognizer (torch CPU, ~3GB image,
#   ~1-1.5GB RAM at inference). It gets NO public domain: the proxy reaches it
#   as http://fen-service:8000 on the compose network, and the apps only ever
#   call POST /fen on the proxy.
#
# First build of fen-service is slow (CPU torch + ~900MB model weights are
# baked into the image, and a warmup inference runs at build time); rebuilds
# are fast thanks to layer caching unless fen-service/ files change.
services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FEN_SERVICE_URL=http://fen-service:8000
      # Browser origins allowed to call POST /v1. The apps don't send an Origin header and
      # are unaffected by this list; anything not listed here is refused before the engine.
      # Both the apex and www must be listed — they are distinct origins to a browser.
      - WEB_ORIGINS=https://chessengineonline.com,https://www.chessengineonline.com
    expose:
      - "3000"
    depends_on:
      - fen-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fen-service:
    build: ./fen-service
    restart: unless-stopped
    # Measured: ~1.03GB RSS with all models loaded, flat across requests
    # (inference is serialized in-process). The caps below make sure a
    # pathological case gets this container OOM-killed and restarted rather
    # than squeezing the other services on the host; 2 CPUs keeps half the
    # box free for them (inference goes ~1s -> ~2s, irrelevant for imports).
    mem_limit: 2g
    cpus: 2.0
    environment:
      - PORT=8000
      - OMP_NUM_THREADS=2
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Models load lazily on the first /fen request, so startup itself is
      # quick; the generous start period covers slow container starts.
      start_period: 30s
